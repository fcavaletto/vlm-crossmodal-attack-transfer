name: CI (model-free)

# No model weights are downloaded and no GPU inference runs here.
# HF_HUB_OFFLINE=1 makes any attempt to reach the Hugging Face Hub fail instead of download;
# the tests that need the pinned processor files skip and say so.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-free:
    name: tests, frozen protocol, reproduction (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple silicon, the platform the committed outputs were produced on.
        os: [macos-15, ubuntu-24.04]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the freeze and preservation checks read history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU-only torch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the recorded environment
        run: python -m pip install -r requirements-ci.txt
      - name: Model-free tests (all suites in one call)
        run: python -m pytest -q -rs
      - name: Frozen protocol, held-out split, analysis outputs and Figure 1
        run: python tools/verify_reproduction.py
