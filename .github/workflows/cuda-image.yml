# Builds the CUDA validation image and pushes it to GHCR. Manual trigger only:
# nothing builds on push, and nothing here creates a RunPod resource.
name: cuda-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (CUDA torch wheels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/cuda/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/study2-cuda-readiness:${{ github.sha }}
      - name: Record the digest to pin in docker/runpod/pod-spec.json
        run: echo "ghcr.io/${{ github.repository_owner }}/study2-cuda-readiness@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
