[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-v4"
version = "0.1.0"
description = "Checkpoint 1.7 development scenes: referent color with frequency distractors"
requires-python = ">=3.11"
dependencies = [
  "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scene_v4*"]
