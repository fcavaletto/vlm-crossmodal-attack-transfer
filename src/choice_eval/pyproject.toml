[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choice-eval"
version = "0.1.0"
description = "Checkpoint 1.7 prospective closed-vocabulary scoring. Does not load weights or run attacks."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["choice_eval*"]
