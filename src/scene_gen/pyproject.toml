[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-gen"
version = "0.1.0"
description = "Deterministic development scenes for cross-modal VLM benchmarks"
requires-python = ">=3.11"
dependencies = [
  "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scene_gen*"]
