[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-v2"
version = "0.2.0"
description = "Revised development scenes for the Checkpoint 1.5 benchmark repair"
requires-python = ">=3.11"
dependencies = [
  "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scene_v2*"]
