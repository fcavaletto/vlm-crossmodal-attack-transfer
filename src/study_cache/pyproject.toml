[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-cache"
version = "0.1.0"
description = "Opt-in launcher that lets model-dependent entry points read the pinned snapshot from another Hub cache"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["study_cache*"]
