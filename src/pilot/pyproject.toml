[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint1-pilot"
version = "0.1.0"
description = "Checkpoint 1 development pilot. Scores committed scenes on MPS. Does not run attacks."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["pilot*"]
