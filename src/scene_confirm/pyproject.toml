[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-confirm"
version = "0.1.0"
description = "Track B confirmation split: seeded independent v4-family counterfactual groups"
requires-python = ">=3.11"
# Pillow 13.0.0 is the version that generated fixtures/trackB_confirm_v1 (see its metadata.json).
# This pin said 11.3.0 until the 2026-11-09 publication audit; that was copied from the earlier
# generators and never matched the environment that built the split.
dependencies = ["Pillow==13.0.0", "numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scene_confirm*"]
