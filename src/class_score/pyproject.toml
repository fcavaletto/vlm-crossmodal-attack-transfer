[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "class-score"
version = "0.1.0"
description = "Checkpoint 1.6 closed-vocabulary scoring. Does not load weights or run attacks."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["class_score*"]
